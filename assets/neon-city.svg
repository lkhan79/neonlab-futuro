<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Metropoli cyberpunk</title>
  <desc>Skyline notturno con palazzi geometrici, luci ciano e rosa e una griglia prospettica.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a2b"/>
      <stop offset="0.65" stop-color="#2b164b"/>
      <stop offset="1" stop-color="#090d1f"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24306a"/>
      <stop offset="1" stop-color="#070d21"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#ffc8ee"/>
      <stop offset="0.7" stop-color="#e86cde"/>
      <stop offset="1" stop-color="#a855f7"/>
    </radialGradient>
    <pattern id="windows" width="34" height="33" patternUnits="userSpaceOnUse">
      <rect x="11" y="9" width="6" height="12" rx="1" fill="#6eefff" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="876" cy="176" r="92" fill="url(#moon)" opacity="0.88"/>
  <circle cx="876" cy="176" r="130" fill="none" stroke="#ff9de6" stroke-opacity="0.2" stroke-width="3"/>
  <g fill="#9bdfff" opacity="0.8">
    <circle cx="137" cy="110" r="2"/><circle cx="360" cy="77" r="3"/>
    <circle cx="552" cy="158" r="2"/><circle cx="1060" cy="92" r="2"/>
  </g>
  <g stroke="#6fe5ff" stroke-opacity="0.5" stroke-width="2">
    <path d="M100 545V270H270V545Z" fill="url(#tower)"/>
    <path d="M270 545V345H405V545Z" fill="url(#tower)"/>
    <path d="M406 545V180H568V545Z" fill="url(#tower)"/>
    <path d="M568 545V305H705V545Z" fill="url(#tower)"/>
    <path d="M713 545V240H825V545Z" fill="url(#tower)"/>
    <path d="M830 545V350H966V545Z" fill="url(#tower)"/>
    <path d="M966 545V275H1110V545Z" fill="url(#tower)"/>
    <path d="M473 180V110M462 125h22"/>
  </g>
  <g fill="url(#windows)" opacity="0.72">
    <rect x="105" y="280" width="162" height="260"/>
    <rect x="410" y="198" width="154" height="340"/>
    <rect x="717" y="258" width="103" height="282"/>
    <rect x="972" y="291" width="131" height="248"/>
  </g>
  <path d="M0 545H1200" stroke="#a855f7" stroke-width="5"/>
  <path d="M0 675 430 545M1200 675 770 545M200 675 475 545M1000 675 725 545" stroke="#56eaff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M0 600H1200M0 636H1200" stroke="#56eaff" stroke-opacity="0.3" stroke-width="2"/>
</svg>
